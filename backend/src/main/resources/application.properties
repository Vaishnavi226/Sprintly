# ============================================
# Sprintly Backend Configuration
# ============================================

# Server Configuration
server.port=8080

# ============================================
# PostgreSQL Database Configuration
# ============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/sprintly
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=SprintlyHikariPool

# ============================================
# JWT Configuration
# ============================================
jwt.secret=your-256-bit-secret-key-replace-me-in-production
jwt.expiration=86400000

# ============================================
# Spring Security Configuration
# ============================================
spring.security.user.name=admin
spring.security.user.password=admin

# ============================================
# Application Logging
# ============================================
logging.level.com.sprintly=INFO
logging.level.com.sprintly.dao=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
